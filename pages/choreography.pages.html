    <!-- Modal CSS/JS (inside the document, once) -->
  <link rel="stylesheet" href="/assets/modal.css">

  <script>
  // Robust blur-up: works for cached images, doesn't override eager/lazy, and fails safe on error
  (function () {
    const imgs = document.querySelectorAll('img.service-thumb, img.portfolio-thumb');

    imgs.forEach((img) => {
      const markLoaded = () => img.classList.add('loaded');

      // If already cached/decoded, load won't fire — handle immediately
      if (img.complete && img.naturalWidth > 0) {
        if (img.decode) {
          img.decode().catch(() => {}).finally(markLoaded);
        } else {
          markLoaded();
        }
        return;
      }

      // Normal path
      img.addEventListener('load', () => {
        if (img.decode) {
          img.decode().catch(() => {}).finally(markLoaded);
        } else {
          markLoaded();
        }
      }, { once: true });

      // Fail safe: don't leave a broken image blurry forever
      img.addEventListener('error', markLoaded, { once: true });
    });
  })();
</script>

<script>
  (function () {
    const form = document.getElementById('contact-form');
    const status = document.getElementById('form-status');
    const sendBtn = document.getElementById('send-btn');

    if (!form) return;

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      // Disable button + show feedback
      const original = sendBtn.textContent;
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending…';

      // Build the payload
      const formData = new FormData(form);

      try {
        const res = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          body: formData
        });
        const json = await res.json();

        if (json.success) {
          status.textContent = 'Thanks! Your message has been sent.';
          status.style.color = '#9be0ff';
          form.reset();
        } else {
          status.textContent = (json.message || 'Sorry, something went wrong. Please try again.');
          status.style.color = '#ff6b6b';
        }
      } catch (err) {
        status.textContent = 'Network error. Please try again in a moment.';
        status.style.color = '#ff6b6b';
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = original;
      }
    });
  })();
</script>
