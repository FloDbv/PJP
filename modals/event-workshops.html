  <script>
  "use strict";

  // ===== Carousel (unchanged) =====
  (function(){
    var slidesEl = document.getElementById("slides");
    var dots = Array.from(document.querySelectorAll(".dot"));
    var total = dots.length, index = 0;
    var AUTO_MS = 5000, RESUME_AFTER = 20000, pausedUntil = 0, timer = null;
    // Put the dots on the bottom edge of the visible media (not the container)
var viewportEl = document.querySelector(".carousel.hero .viewport");
function updateDots() {
  if (!viewportEl) return;
  var slide = document.querySelector('.slides > .slide:nth-child(' + (index + 1) + ')');
  var cw = viewportEl.clientWidth;
  var ch = viewportEl.clientHeight;
  var contentH = ch; // fallback

  if (!slide) return;

  // Image slide
  var img = slide.querySelector('img');
  if (img && (img.naturalWidth || img.complete)) {
    var iw = img.naturalWidth || cw;
    var ih = img.naturalHeight || ch;
    var ar = iw / ih;
    contentH = Math.min(ch, cw / ar); // contain rules
  }

  // YouTube slide (assume 16:9)
  var frame = slide.querySelector('iframe');
  if (frame) {
    var arVid = 16 / 9;
    contentH = Math.min(ch, cw / arVid);
  }

  // Vertical offset equals the letterbox bar height
  var bars = Math.max(0, (ch - contentH) / 2);
  document.documentElement.style.setProperty('--dots-bottom', bars + 'px');
}

    function goTo(i){
  index=(i+total)%total;
  slidesEl.style.transform="translateX("+(-100*index)+"%)";
  dots.forEach(function(d,j){
    var a=j===index;
    d.setAttribute("aria-current",a?"true":"false");
    d.setAttribute("aria-selected",a?"true":"false");
  });
  updateDots(); // <-- recalc dots position for the new slide
}

    function next(){ goTo(index+1); } function prev(){ goTo(index-1); }
    function pauseFor(ms){ pausedUntil=Date.now()+ms; }
    function start(){ if (timer) clearInterval(timer); timer=setInterval(function(){ if(Date.now()>=pausedUntil) next(); }, AUTO_MS); }
    document.getElementById("next").addEventListener("click", function(){ pauseFor(RESUME_AFTER); next(); });
    document.getElementById("prev").addEventListener("click", function(){ pauseFor(RESUME_AFTER); prev(); });
    dots.forEach(function(d){ d.addEventListener("click", function(){ pauseFor(RESUME_AFTER); goTo(parseInt(d.getAttribute("data-index"),10)||0); });});
    document.querySelector(".carousel").addEventListener("click", function(){ pauseFor(RESUME_AFTER); });
    goTo(0); start();
    updateDots();
    window.addEventListener('resize', function(){ updateDots(); });
    document.getElementById("y").textContent = new Date().getFullYear();
  })();

  // ===== Smooth anchor scrolling (override default to account for sticky header) =====
  (function(){
    var header = document.querySelector('header');
    var offset = function(){ return (header ? header.offsetHeight : 0) + 8; }; // small breathing room

    function smoothScrollTo(targetId){
  // Back-to-top should go to absolute page top
  
  const el = document.getElementById(targetId);
  if (!el) return;

  const top = el.getBoundingClientRect().top + window.pageYOffset - offset();
  window.scrollTo({ top, behavior: 'smooth' });
}

    // Intercept clicks on internal anchors in header and footer
    document.addEventListener('click', function(e){
      var a = e.target.closest('a[href^="#"]');
      if (!a) return;
      var id = a.getAttribute('href').slice(1);
      if (!id) return;
      var target = document.getElementById(id);
      if (!target) return;
      e.preventDefault();
      smoothScrollTo(id);
    });
  })();

  </script>

  <script>
  // Robust blur-up: works for cached images, doesn't override eager/lazy, and fails safe on error
  (function () {
    const imgs = document.querySelectorAll('img.service-thumb, img.portfolio-thumb');

    imgs.forEach((img) => {
      const markLoaded = () => img.classList.add('loaded');

      // If already cached/decoded, load won't fire — handle immediately
      if (img.complete && img.naturalWidth > 0) {
        if (img.decode) {
          img.decode().catch(() => {}).finally(markLoaded);
        } else {
          markLoaded();
        }
        return;
      }

      // Normal path
      img.addEventListener('load', () => {
        if (img.decode) {
          img.decode().catch(() => {}).finally(markLoaded);
        } else {
          markLoaded();
        }
      }, { once: true });

      // Fail safe: don't leave a broken image blurry forever
      img.addEventListener('error', markLoaded, { once: true });
    });
  })();
</script>

<script>
  (function () {
    const form = document.getElementById('contact-form');
    const status = document.getElementById('form-status');
    const sendBtn = document.getElementById('send-btn');

    if (!form) return;

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      // Disable button + show feedback
      const original = sendBtn.textContent;
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending…';

      // Build the payload
      const formData = new FormData(form);

      try {
        const res = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          body: formData
        });
        const json = await res.json();

        if (json.success) {
          status.textContent = 'Thanks! Your message has been sent.';
          status.style.color = '#9be0ff';
          form.reset();
        } else {
          status.textContent = (json.message || 'Sorry, something went wrong. Please try again.');
          status.style.color = '#ff6b6b';
        }
      } catch (err) {
        status.textContent = 'Network error. Please try again in a moment.';
        status.style.color = '#ff6b6b';
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = original;
      }
    });
  })();
</script>
